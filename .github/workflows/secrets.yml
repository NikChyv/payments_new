name: Secret scan

# Сторож против повторения инцидента 09.09.2026: боевой service_role-ключ три
# месяца пролежал в baseline-миграции публичного репозитория. Утёк он не по
# злому умыслу — baseline снят дампом схемы, а в дампе триггеры Database
# Webhooks идут вместе с заголовком Authorization: Bearer <ключ>.
#
# Поэтому проверяем машинно, на каждый push, а не «стараемся не забывать».

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JWT-ключи Supabase в коде
        run: |
          # JWT целиком: три base64-сегмента через точку, начинается с eyJ.
          #
          # Исключения, и почему они законны:
          #   docs/          — отчёты ревью цитируют находки текстом;
          #   app/js/config.js — anon-ключ фронта, он публичный по определению;
          #   tools/uicheck.mjs — ключи ЛОКАЛЬНОГО стека, одинаковы у всех;
          #   app.html, index.html в корне — легаси прежних версий (CLAUDE.md),
          #                    не развиваются, ключ там тоже публичный anon.
          HITS=$(grep -rEn "eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}" \
                   --exclude-dir=.git --exclude-dir=docs --exclude-dir=node_modules \
                   --exclude=config.js --exclude=uicheck.mjs \
                   --exclude=app.html --exclude=index.html . || true)
          if [ -n "$HITS" ]; then
            echo "::error::Найден JWT вне разрешённых мест."
            echo "$HITS" | sed -E 's/eyJ[A-Za-z0-9_.-]+/eyJ<СКРЫТО>/g'
            exit 1
          fi
          echo "OK: JWT вне разрешённых мест не найдено."

      - name: Secret-ключи Supabase
        run: |
          # sb_secret_ не должен попадать в репозиторий ВООБЩЕ — в отличие от
          # sb_publishable_, которому место во фронте.
          HITS=$(grep -rEn "sb_secret_[A-Za-z0-9_-]{5,}" \
                   --exclude-dir=.git --exclude-dir=node_modules . || true)
          if [ -n "$HITS" ]; then
            echo "::error::Найден secret-ключ Supabase."
            echo "$HITS" | sed -E 's/sb_secret_[A-Za-z0-9_-]+/sb_secret_<СКРЫТО>/g'
            exit 1
          fi
          echo "OK: secret-ключей не найдено."

      - name: Токен Telegram-бота
        run: |
          # Формат: <цифры>:<35+ символов>. В репозитории допустим только
          # плейсхолдер <TELEGRAM_BOT_TOKEN>.
          HITS=$(grep -rEn "[0-9]{8,12}:[A-Za-z0-9_-]{30,}" \
                   --exclude-dir=.git --exclude-dir=docs --exclude-dir=node_modules . || true)
          if [ -n "$HITS" ]; then
            echo "::error::Похоже на токен Telegram-бота."
            echo "$HITS" | sed -E 's/[0-9]{8,12}:[A-Za-z0-9_-]+/<СКРЫТО>/g'
            exit 1
          fi
          echo "OK: токенов бота не найдено."

      - name: Заголовки с ключом в миграциях
        run: |
          # Ровно тот случай, который уже случился. Database Webhooks живут вне
          # миграций (docs/ARCHITECTURE.md, п. 5) — слову Bearer тут не место.
          HITS=$(grep -rn "Bearer" supabase/migrations/ || true)
          if [ -n "$HITS" ]; then
            echo "::error::В миграциях есть заголовок с ключом. Вебхуки настраиваются отдельно — scripts/webhooks.sql"
            echo "$HITS" | sed -E 's/(Bearer )[A-Za-z0-9_.-]+/\1<СКРЫТО>/g'
            exit 1
          fi
          echo "OK: миграции чисты."
